<!DOCTYPE html>
<html>
<head>
    <title>Clear Cache - Rankly</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #0a0a0a;
            color: #fff;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: #1a1a1a;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 500px;
        }
        h1 { margin: 0 0 20px; color: #4ade80; }
        button {
            background: #4ade80;
            color: #000;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: #22c55e; }
        .info { margin: 20px 0; color: #888; }
        .success { color: #4ade80; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗑️ Clear All Caches</h1>
        <p class="info">This will clear all cached data including:<br>
        • LocalStorage<br>
        • SessionStorage<br>
        • Analysis data<br>
        • Authentication tokens</p>
        
        <button onclick="clearAll()">Clear Everything</button>
        <button onclick="goToNewAnalysis()">Start New Analysis</button>
        
        <div id="status"></div>
    </div>

    <script>
        function clearAll() {
            // Clear localStorage
            localStorage.clear();
            
            // Clear sessionStorage
            sessionStorage.clear();
            
            // Clear specific items
            const keysToRemove = [
                'authToken',
                'refreshToken',
                'selectedAnalysisId',
                'onboarding-data',
                'websiteData',
                'dashboardData',
                'filters'
            ];
            
            keysToRemove.forEach(key => {
                localStorage.removeItem(key);
                sessionStorage.removeItem(key);
            });
            
            document.getElementById('status').innerHTML = 
                '<p class="success">✅ All caches cleared successfully!</p>';
            
            setTimeout(() => {
                window.location.href = '/onboarding/website';
            }, 1500);
        }
        
        function goToNewAnalysis() {
            clearAll();
        }
    </script>
</body>
</html>
